version: "2"

# Internal variables

# Docker Data Path:
# In standard systems, depends on the docker architecture (e.g. /data/docker)
# In docker containers, is the resulting path of container's mount (e.g. /docker)
{{ $docker_path := "/data/docker" }}

# DB Engine Name:
# script dump_db.sh supports one of the following engines:
# mariadb, mysql, postgres, mongo and mssql
# Refer to script's help for more info about its usage.
{{ $db_engine_name := "mariadb" }}

profiles:
  # Most common use case is to backup live containers, preferably scheduled
  # at low traffic hours
  default-service-backup:
    env-file...:
      - secrets/.env-restic
    inherit: default-backup
    backup:
      # Enable backup with relative source paths. This will change the working
      # directory of the "restic backup" command to "source-base", and will not
      # expand "source" to an absolute path
      # (Default is false)
      source-relative: true
      # The base path to resolve relative backup paths against.
      # Defaults to current directory if unset or empty
      source-base: {{ $docker_path }}/{{ .Profile.Name }}
      # The paths to backup
      source: [.]

  # When a container requires to be stopped for backup concurrency,
  # this variant of the above stops the container (if found running) first,
  # and then starts it after backup took place.
  # The script invoked allows multiple containers as arguments, and will
  # start or stop them in the same order they are being passed.
  default-service-backup-downtime:
    inherit: default-service-backup
    backup:
      ...run-before:
        - $SCRIPTS_PATH/docker_management.sh stop $PROFILE_NAME
      run-finally...:
        - $SCRIPTS_PATH/docker_management.sh start $PROFILE_NAME

  # When a stack contains a database container (e.g. mariadb), the invoked
  # script dumps the DB to a persistent location by using inherited environment
  # variables passed to it, deleting old dumps created by itself in the
  # process. All this, right before to start with the backup operation.
  default-service-backup-database:
    env-file...:
      - {{ $docker_path }}/{{ .Profile.Name }}/.env-{{ $db_engine_name }}
    inherit: default-service-backup
    backup:
      run-before...:
        - $SCRIPTS_PATH/db_dump.sh --db-engine={{ $db_engine_name }} --db-container-name=$PROFILE_NAME-{{ $db_engine_name }}

# Functional examples of backup profiles:

# Live backup:
#  some-service-live-backup:
#    inherit: default-service-backup

# Concurrent backup:
#  some-service-concurrent-backup:
#    inherit: default-service-backup-downtime

# Backup including database dump
#  some-service-db-backup:
#    inherit: default-service-backup-database
