version: "2"

# Docker Data Path (internal variable)
# In standard systems depends on the docker architecture (e.g. /data/docker)
# In docker containers, the resulting path of container's mount (e.g. /docker)
{{ $docker_path := "/data/docker" }}

# Optionally, Environment can be read from, e.g. .env-common, and
# '.Env.{VARIABLE}' or '.Env.VARIABLE' will expand ${VARIABLE} and
# $VARIABLE, respectively (enclosed within double curly brackets and spaces).
# This is more useful for variable expansion on multiple files.

profiles:
  # Most common use case is to backup live containers, preferably scheduled
  # at low traffic hours
  default-service-backup:
    env-file...:
      - secrets/.env-restic
    inherit: default-backup
    backup:
      # Enable backup with relative source paths. This will change the working
      # directory of the "restic backup" command to "source-base", and will not
      # expand "source" to an absolute path
      # (Default is false)
      source-relative: true
      # The base path to resolve relative backup paths against.
      # Defaults to current directory if unset or empty
      source-base: {{ $docker_path }}/{{ .Profile.Name }}
      #source-base: {{ .Env.$DOCKER_PATH }}/{{ .Profile.Name }}
      # The paths to backup
      source: [.]

  # When a container requires to be stopped for backup concurrency,
  # this variant of the above stops the container (if found running) first,
  # and then starts it after backup took place.
  # The script invoked allows multiple containers as arguments, and will
  # start or stop them in the same order they are being passed.
  default-service-backup-downtime:
    inherit: default-service-backup
    backup:
      ...run-before:
        - $SCRIPTS_PATH/docker_management.sh stop $PROFILE_NAME
      run-finally...:
        - $SCRIPTS_PATH/docker_management.sh start $PROFILE_NAME

  # When some container into a compose is a DB engine, this template performs a
  # dump prior to the operation, allowing thus concurrent backup of databases.
  # The involved script (db_dump.sh) only needs '--db-container-name' to work
  # with the following official DB engine images: Mariadb, Mysql, Postgres,
  # Mongo and Mssql (for mssql, '--dump-path' argument is also required).
  # Environment can be passed by either appending corresponding env files into
  # 'env-file...' section below or using optional arguments for custom DB dump.
  # If no environment or optional arguments are passed, the script will attempt
  # to auto-detect the DB engine and will work with in-container DB environment
  default-service-backup-database:
    env-file...:
      - {{ $docker_path }}/{{ .Profile.Name }}/.env-db
      #- {{ .Env.$DOCKER_PATH }}/{{ .Profile.Name }}/.env-db
    inherit: default-service-backup
    backup:
      run-before...:
        - $SCRIPTS_PATH/db_dump.sh --db-container-name=$PROFILE_NAME-db

# Functional examples of backup profiles:

# Live backup:
#  some-service-live-backup:
#    inherit: default-service-backup

# Concurrent backup:
#  some-service-concurrent-backup:
#    inherit: default-service-backup-downtime

# Backup including database dump
#  some-service-db-backup:
#    inherit: default-service-backup-database
